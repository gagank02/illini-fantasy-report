name: Weekly report

# Every Tuesday 15:23 UTC (10:23am Central in fall), after Monday night games are final.
# Odd minute on purpose: GitHub delays or drops scheduled runs at the top of the hour under load.
# Writes the report with Claude on the commissioner's subscription and opens a PR to review.
on:
  schedule:
    - cron: '23 15 * * tue'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number (leave blank for the latest finished week)'
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency: weekly-report

jobs:
  # The Cloudflare backup (workers/refresh-cron) starts this workflow when GitHub drops the scheduled run. If GitHub's
  # run then shows up late anyway, it stops here, before any API call, so the day still has exactly one real run.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow weekly-report.yml --created ">=$(date -u +%F)T15:00:00Z" \
            --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          echo "Other runs since 15:00 UTC today: $others"
          echo "skip=$([ "$others" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  report:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLEEPER_LEAGUE_ID: '1386106937921253376'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Completed seasons' Sleeper responses, saved by ci.yml (never committed). Saves about 45 calls per run.
      - name: Restore cached Sleeper history
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro/sleeper
          key: sleeper-history-
          restore-keys: sleeper-history-
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.292

      # Player list (names, positions, injuries): at most one /players/nfl call per UTC day, as Sleeper asks.
      # The full list lives in .cache (never committed) and is shared with refresh.yml through this cache key.
      # The first run of the day fetches it and caches it right away; later runs that day reuse the cache,
      # so reruns never add calls, even if the job fails afterwards or the PR isn't merged.
      - name: Today's date (UTC)
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore today's player list
        id: players-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/players-full.json
          key: sleeper-players-${{ steps.day.outputs.date }}
      # Always runs: fetches only if the cache missed, then writes the site's subset from today's rosters.
      - name: Update player lists
        run: npm run players
      - name: Cache today's player list
        if: steps.players-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .cache/players-full.json
          key: sleeper-players-${{ steps.day.outputs.date }}

      - name: Write the report
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WEEK: ${{ inputs.week }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "CLAUDE_CODE_OAUTH_TOKEN secret is not set (run claude setup-token)"; exit 1; fi
          if [ -n "$WEEK" ] && ! [[ "$WEEK" =~ ^[0-9]+$ ]]; then echo "Week must be a number"; exit 1; fi
          npm run report -- ${WEEK:+--week "$WEEK"}

      # ci.yml does not run on PRs opened with GITHUB_TOKEN, so the same checks run here before the PR exists.
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Fail if secrets leaked into the build
        run: |
          if grep -rIl -e 'sk-ant-' -e 'pages/webhooks/deploy_hooks' dist/; then
            echo "Secret pattern found in dist/ (files listed above)"
            exit 1
          fi
      - name: Lint every report against writing-style.md
        run: find src/content/reports -name '*.md' -print0 | xargs -0 -r npm run lint:report --

      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=$(git status --porcelain --untracked-files=all src/content/reports | awk '{print $2}' | head -n 1)
          if [ -z "$file" ]; then echo "No report changed"; exit 1; fi
          season=$(echo "$file" | cut -d/ -f4)
          week=$(basename "$file" .md | sed 's/week-//')
          branch="report/${season}-week-${week}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "$file" src/data/players.json
          title="${season} Week ${week} report"
          git commit -m "$title"
          git push --force origin "$branch"

          # Only an OPEN PR counts. gh pr view also finds merged/closed PRs, which made a rerun after
          # merging silently update the old merged PR instead of opening a new one.
          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title"
            echo "Updated open PR #$open_pr: $title"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$(cat <<EOF
          The ${season} week ${week} report, written by Claude from the Sleeper facts bundle (Sleeper is the only data source).

          Before this PR opened, the workflow ran the tests, type check, build, secret scan, and style linter (\`ci.yml\` does not run on bot PRs).

          **Before merging:** read it, check anything that looks off against Sleeper, and edit the markdown here if you want. Cloudflare will comment a preview link.
          EOF
          )"
          fi
