name: Daily refresh

# Rebuilds the site on Cloudflare so Sleeper data stays current.
# Also the only place that calls FantasyCalc: once a day, once the FANTASYCALC_ENABLED repo variable is 'true'.
# Odd minute on purpose: GitHub delays or drops scheduled runs at the top of the hour under load.
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLEEPER_LEAGUE_ID: '1386106937921253376'
    steps:
      - uses: actions/checkout@v4
        if: vars.FANTASYCALC_ENABLED == 'true'
      - uses: actions/setup-node@v4
        if: vars.FANTASYCALC_ENABLED == 'true'
        with:
          node-version: 24
          cache: npm
      - if: vars.FANTASYCALC_ENABLED == 'true'
        run: npm ci

      # One /values/current call at most per UTC day: the script skips if today's values are already saved.
      # If FantasyCalc is down, the site still rebuilds with yesterday's values.
      - name: Update trade values
        if: vars.FANTASYCALC_ENABLED == 'true'
        continue-on-error: true
        env:
          FANTASYCALC: live
        run: npm run values

      # A push to main makes Cloudflare rebuild on its own, so the deploy hook is only needed without one.
      - name: Commit new values
        id: commit
        if: vars.FANTASYCALC_ENABLED == 'true'
        run: |
          if git diff --quiet --exit-code -- src/data/trade-values.json && [ -z "$(git ls-files --others -- src/data/trade-values.json)" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/trade-values.json
          git commit -m "Trade values for $(date -u +%F)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages build
        if: steps.commit.outputs.pushed != 'true'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
