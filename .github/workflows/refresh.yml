name: Daily refresh

# Rebuilds the site on Cloudflare so Sleeper data stays current, and refreshes three saved data files, each at most
# once per UTC day:
# - Sleeper's player list (/players/nfl: names, positions, injury tags). The full list stays in the Actions cache
#   (.cache/players-full.json, never committed), sharing its key with weekly-report.yml so the two together never
#   call it twice in a day. Only the players our pages use are committed, to src/data/players.json.
# - src/data/trades.json (trade suggestions from FantasyCalc /values/current), once the FANTASYCALC_ENABLED repo
#   variable is 'true'. Only the suggestions are committed; FantasyCalc's raw values are never saved to the repo.
# - src/data/nflverse.json (from nflverse). The full download stays in the Actions cache (.cache/nflverse-full.json,
#   never committed). Only what our pages show is committed: weeks that fill gaps in rostered players' lines, and the
#   Buy low / Sell high tags.
# Odd minute on purpose: GitHub delays or drops scheduled runs at the top of the hour under load.
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      force_fantasycalc:
        description: 'Call FantasyCalc again even if it was already called today (they allow at most once per hour). Use sparingly.'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-refresh

jobs:
  # The Cloudflare backup (workers/refresh-cron) starts this workflow when GitHub drops the scheduled run. If GitHub's
  # run then shows up late anyway, it stops here, before any API call, so the day still has exactly one real run.
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow refresh.yml --created ">=$(date -u +%F)T10:00:00Z" \
            --json databaseId --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          echo "Other runs since 10:00 UTC today: $others"
          echo "skip=$([ "$others" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  refresh:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLEEPER_LEAGUE_ID: '1386106937921253376'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Completed seasons' Sleeper responses, saved by ci.yml (never committed). Saves about 45 calls per run.
      - name: Restore cached Sleeper history
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro/sleeper
          key: sleeper-history-
          restore-keys: sleeper-history-
      - name: Today's date (UTC)
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Sleeper player list. Same key as weekly-report.yml. Cached right after a good fetch, so a rerun skips.
      # If Sleeper is down, the site still rebuilds with yesterday's list.
      - name: Restore today's player list
        id: players-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/players-full.json
          key: sleeper-players-${{ steps.day.outputs.date }}
      # Always runs: fetches only if the cache missed, then writes the site's subset from today's rosters.
      - name: Update player lists
        id: players
        continue-on-error: true
        run: npm run players
      - name: Cache today's player list
        if: steps.players-cache.outputs.cache-hit != 'true' && steps.players.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/players-full.json
          key: sleeper-players-${{ steps.day.outputs.date }}

      # nflverse (CC-BY 4.0): this season's weekly PPR points and expected points, a few MB of CSV from GitHub releases.
      # Same pattern as the player list: the full summary stays in the Actions cache (.cache/nflverse-full.json, never
      # committed), downloaded at most once a UTC day. Only what our pages show is committed, to src/data/nflverse.json.
      # If a download fails, or the files look broken, yesterday's file stays.
      - name: Restore today's nflverse data
        id: nflverse-cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/nflverse-full.json
          key: nflverse-full-${{ steps.day.outputs.date }}
      - name: Update nflverse data
        id: nflverse
        continue-on-error: true
        run: npm run nflverse
      - name: Cache today's nflverse data
        if: steps.nflverse-cache.outputs.cache-hit != 'true' && steps.nflverse.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache/nflverse-full.json
          key: nflverse-full-${{ steps.day.outputs.date }}

      # FantasyCalc: at most ONE call per UTC day, even if it fails. Their docs only ask for hourly at most,
      # we are stricter on purpose. Three guards: the "called today" marker below (saved pass or fail), today's
      # cached suggestions, and the script itself, which skips if the saved file already holds today's.
      # If FantasyCalc is down, the site still rebuilds with yesterday's suggestions.
      - name: Already called FantasyCalc today?
        id: fc-called
        if: vars.FANTASYCALC_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .fantasycalc-called
          key: fantasycalc-called-${{ steps.day.outputs.date }}
      - name: Restore today's trade suggestions
        id: values-cache
        if: vars.FANTASYCALC_ENABLED == 'true'
        uses: actions/cache/restore@v6
        with:
          path: src/data/trades.json
          key: fantasycalc-trades-${{ steps.day.outputs.date }}
      - name: Update trade suggestions
        id: values
        if: vars.FANTASYCALC_ENABLED == 'true' && (inputs.force_fantasycalc || (steps.fc-called.outputs.cache-hit != 'true' && steps.values-cache.outputs.cache-hit != 'true'))
        continue-on-error: true
        env:
          FANTASYCALC: live
          FANTASYCALC_FORCE: ${{ inputs.force_fantasycalc && 'true' || '' }}
        run: npm run trades
      - name: Remember we called FantasyCalc today, pass or fail
        if: steps.values.outcome == 'success' || steps.values.outcome == 'failure'
        run: touch .fantasycalc-called
      - name: Save the called-today marker
        if: (steps.values.outcome == 'success' || steps.values.outcome == 'failure') && steps.fc-called.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .fantasycalc-called
          key: fantasycalc-called-${{ steps.day.outputs.date }}
      - name: Cache today's trade suggestions
        if: steps.values.outcome == 'success' && steps.values-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: src/data/trades.json
          key: fantasycalc-trades-${{ steps.day.outputs.date }}

      # A push to main makes Cloudflare rebuild on its own, so the deploy hook is only needed without one.
      - name: Commit new data
        id: commit
        run: |
          git add -A src/data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily data for $(date -u +%F)"
          git pull --rebase -q origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages build
        if: steps.commit.outputs.pushed != 'true'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
