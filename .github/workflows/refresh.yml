name: Daily refresh

# Rebuilds the site on Cloudflare so Sleeper data stays current, and refreshes two saved data files, each at most
# once per UTC day:
# - src/data/players.json (Sleeper /players/nfl: names, positions, injury tags). Shares its cache key with
#   weekly-report.yml, so the two workflows together never call Sleeper's player list twice in a day.
# - src/data/trades.json (trade suggestions from FantasyCalc /values/current), once the FANTASYCALC_ENABLED repo
#   variable is 'true'. Only the suggestions are committed; FantasyCalc's raw values are never saved to the repo.
# Odd minute on purpose: GitHub delays or drops scheduled runs at the top of the hour under load.
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLEEPER_LEAGUE_ID: '1386106937921253376'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Today's date (UTC)
        id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Sleeper player list. Same key as weekly-report.yml. Cached right after a good fetch, so a rerun skips.
      # If Sleeper is down, the site still rebuilds with yesterday's list.
      - name: Restore today's player list
        id: players-cache
        uses: actions/cache/restore@v4
        with:
          path: src/data/players.json
          key: sleeper-players-${{ steps.day.outputs.date }}
      - name: Refresh player list (first run of the day only)
        id: players
        if: steps.players-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: npm run players
      - name: Cache today's player list
        if: steps.players.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/players.json
          key: sleeper-players-${{ steps.day.outputs.date }}

      # FantasyCalc: at most ONE call per UTC day, even if it fails. Their docs only ask for hourly at most,
      # we are stricter on purpose. Three guards: the "called today" marker below (saved pass or fail), today's
      # cached suggestions, and the script itself, which skips if the saved file already holds today's.
      # If FantasyCalc is down, the site still rebuilds with yesterday's suggestions.
      - name: Already called FantasyCalc today?
        id: fc-called
        if: vars.FANTASYCALC_ENABLED == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .fantasycalc-called
          key: fantasycalc-called-${{ steps.day.outputs.date }}
      - name: Restore today's trade suggestions
        id: values-cache
        if: vars.FANTASYCALC_ENABLED == 'true'
        uses: actions/cache/restore@v4
        with:
          path: src/data/trades.json
          key: fantasycalc-trades-${{ steps.day.outputs.date }}
      - name: Update trade suggestions
        id: values
        if: vars.FANTASYCALC_ENABLED == 'true' && steps.fc-called.outputs.cache-hit != 'true' && steps.values-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          FANTASYCALC: live
        run: npm run trades
      - name: Remember we called FantasyCalc today, pass or fail
        if: steps.values.outcome == 'success' || steps.values.outcome == 'failure'
        run: touch .fantasycalc-called
      - name: Save the called-today marker
        if: steps.values.outcome == 'success' || steps.values.outcome == 'failure'
        uses: actions/cache/save@v4
        with:
          path: .fantasycalc-called
          key: fantasycalc-called-${{ steps.day.outputs.date }}
      - name: Cache today's trade suggestions
        if: steps.values.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: src/data/trades.json
          key: fantasycalc-trades-${{ steps.day.outputs.date }}

      # A push to main makes Cloudflare rebuild on its own, so the deploy hook is only needed without one.
      - name: Commit new data
        id: commit
        run: |
          git add -A src/data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Daily data for $(date -u +%F)"
          git pull --rebase -q origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare Pages build
        if: steps.commit.outputs.pushed != 'true'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_DEPLOY_HOOK_URL secret is not set"; exit 1; fi
          curl -fsS -X POST "$HOOK" -o /dev/null
