name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SLEEPER_LEAGUE_ID: '1386106937921253376'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev
      - name: Fail if secrets leaked into the build
        run: |
          if grep -rIl -e 'sk-ant-' -e 'pages/webhooks/deploy_hooks' dist/; then
            echo "Secret pattern found in dist/ (files listed above)"
            exit 1
          fi
