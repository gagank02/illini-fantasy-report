name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SLEEPER_LEAGUE_ID: '1386106937921253376'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Completed seasons' Sleeper responses (written by sleeper.ts, never committed). Restored after npm ci,
      # which empties node_modules. The key changes only when a new file appears, like a newly finished season.
      - name: Restore cached Sleeper history
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro/sleeper
          key: sleeper-history-
          restore-keys: sleeper-history-
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Save cached Sleeper history
        uses: actions/cache/save@v6
        with:
          path: node_modules/.astro/sleeper
          key: sleeper-history-${{ hashFiles('node_modules/.astro/sleeper/*') }}
      - run: npm audit --omit=dev
      - name: Lint every report against writing-style.md
        run: find src/content/reports -name '*.md' -print0 | xargs -0 -r npm run lint:report --
      - name: Fail if secrets leaked into the build
        run: |
          if grep -rIl -e 'sk-ant-' -e 'pages/webhooks/deploy_hooks' dist/; then
            echo "Secret pattern found in dist/ (files listed above)"
            exit 1
          fi
